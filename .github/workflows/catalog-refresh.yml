name: Refresh recent AVT catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: pip install aiohttp beautifulsoup4 lxml

      - name: Crawl recent AVT ids
        run: python scripts/build_catalog.py --start 14000 --end 16000 --concurrency 6

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh AVT catalog"
          git push
