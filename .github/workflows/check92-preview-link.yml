name: Check92 public preview link
on:
  push:
    branches: [design/check92-black-signal-20261028]
    paths: ['.github/workflows/check92-preview-link.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check immutable public preview and resource headers
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.request,urllib.parse,pathlib
          prefix='Anchor992/chip-tuning/0f8d31bdc0e8ea31be5316382acbbc86cea8cf9d/cinematic-preview/black-signal/'
          paths=['index.html','app.js','style.css','style-base.css','assets/porsche-911-930.glb','assets/audi-r8.glb','assets/bmw-m3-e30.glb','assets/porsche-911-930-mobile.glb','../assets/engine.glb','../assets/studio.hdr','assets/porsche-poster.png']
          def check(base,p):
              url=urllib.parse.urljoin(base,p)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Check92PreviewCheck'})
                  with urllib.request.urlopen(req,timeout=35) as response:
                      chunk=response.read(600)
                      return {'path':p,'status':response.status,'type':response.headers.get('Content-Type'),'length':response.headers.get('Content-Length'),'valid':(b'CHECK92' in chunk or b'Check92' in chunk) if p=='index.html' else (chunk[:4]==b'glTF' if p.endswith('.glb') else bool(chunk))}
              except Exception as e:return {'path':p,'error':str(e),'valid':False}
          reports=[]
          for host in ['rawcdn.githack.com','raw.githack.com']:
              base='https://'+host+'/'+prefix
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  checks=list(pool.map(lambda p:check(base,p),paths))
              report={'url':base+'index.html','checks':checks,'passed':all(x['valid'] and x.get('status')==200 for x in checks)}
              print('PUBLIC_PREVIEW_CHECK '+json.dumps(report),flush=True)
              reports.append(report)
              if report['passed']:
                  pathlib.Path('/tmp/check92-preview-url').write_text(report['url'])
                  break
          pathlib.Path('/tmp/check92-link-report.json').write_text(json.dumps(reports,indent=2))
          if not any(r['passed'] for r in reports):raise SystemExit('No fully validated preview origin')
          PY
      - name: Open public URL in browser
        run: |
          mkdir -p /tmp/check92-browser
          cd /tmp/check92-browser
          npm install --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node - <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');const {execSync}=require('child_process');
          (async()=>{
            const executablePath=execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-angle=swiftshader']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const url=fs.readFileSync('/tmp/check92-preview-url','utf8');
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.__check92?.snapshot().loaded.every(Boolean),{},{timeout:60000});
            const initial=await page.evaluate(()=>window.__check92.snapshot());
            await page.locator('[data-car="1"]').click();
            await page.waitForTimeout(800);
            const selected=await page.evaluate(()=>window.__check92.snapshot());
            await page.screenshot({path:'/tmp/check92-live-preview.png'});
            await page.evaluate(()=>{const m=window.__check92.snapshot().metrics;window.scrollTo({top:m.filmTop+m.filmTravel*.66,behavior:'instant'})});
            await page.waitForFunction(()=>window.__check92.snapshot().engineLoaded,{},{timeout:45000});
            const story=await page.evaluate(()=>window.__check92.snapshot());
            const result={url,status:response.status(),title:await page.title(),initial,selected,story,errors};
            console.log('PUBLIC_BROWSER_RESULT '+JSON.stringify(result));fs.writeFileSync('/tmp/check92-browser-report.json',JSON.stringify(result,null,2));
            await browser.close();if(errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Store verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check92-public-link-evidence
          path: |
            /tmp/check92-link-report.json
            /tmp/check92-browser-report.json
            /tmp/check92-live-preview.png
          retention-days: 2
