name: Check92 isolated preview QA
on:
  push:
    branches: [design/check92-black-signal-20261028]
    paths:
      - '.github/workflows/check92-black-signal.yml'
      - 'cinematic-preview/black-signal/**'
permissions:
  contents: write
concurrency:
  group: check92-black-signal-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned preview tools
        run: |
          npm install --prefix .check92-tools --ignore-scripts --no-audit --no-fund three@0.180.0 esbuild@0.25.10 playwright@1.56.1
          python3 -m pip install Pillow==11.3.0
      - name: Prepare isolated build and verify model provenance
        run: |
          mkdir -p /tmp/check92-review/cinematic-preview /tmp/check92-review/review
          cp -a cinematic-preview/. /tmp/check92-review/cinematic-preview/
          cp -a .check92-tools/node_modules /tmp/check92-review/node_modules
          python3 /tmp/check92-review/cinematic-preview/black-signal/fetch_assets.py
          python3 /tmp/check92-review/cinematic-preview/black-signal/optimize_assets.py
      - name: Compile the actual implementation
        working-directory: /tmp/check92-review
        run: |
          node --check cinematic-preview/black-signal/main.js
          node --check cinematic-preview/black-signal/ecu.js
          node node_modules/esbuild/bin/esbuild cinematic-preview/black-signal/main.js --bundle --format=esm --minify --target=safari16 --outfile=cinematic-preview/black-signal/app.js
      - name: Render and test desktop and mobile viewports
        working-directory: /tmp/check92-review
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/check92-server.log 2>&1 &
          node cinematic-preview/black-signal/qa.mjs
      - name: Preserve generated preview assets on this branch only
        if: success()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=design/check92-black-signal-20261028
          test "$GITHUB_REF" = "refs/heads/$branch"
          git fetch origin "$branch"
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
            echo 'Branch moved; leaving generated output in the artifact without overwriting newer work.'
            exit 0
          fi
          mkdir -p cinematic-preview/black-signal/assets
          cp -a /tmp/check92-review/cinematic-preview/black-signal/assets/. cinematic-preview/black-signal/assets/
          cp /tmp/check92-review/cinematic-preview/black-signal/app.js cinematic-preview/black-signal/app.js
          git add -- cinematic-preview/black-signal/assets cinematic-preview/black-signal/app.js
          if ! git diff --cached --quiet; then
            git -c user.name='Check92 preview builder' -c user.email='check92-preview@users.noreply.github.com' commit -m 'build: preserve tested isolated preview assets [skip ci]'
            git push origin "HEAD:refs/heads/$branch"
          fi
      - name: Upload standalone build and evidence, never deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check92-black-signal-review
          path: |
            /tmp/check92-review/cinematic-preview
            /tmp/check92-review/review
          retention-days: 7
          if-no-files-found: error
