<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="robots" content="noindex"><title>CHECK92 — весь фильм</title>
<style>
:root{color-scheme:dark;--orange:#ff5a21}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui,-apple-system,sans-serif}main{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto}iframe{width:100%;height:100%;border:0;background:#080808}footer{padding:12px max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));border-top:1px solid #303030;display:grid;grid-template-columns:auto minmax(100px,1fr) auto auto;align-items:center;gap:12px 22px;background:#111}button,select,a,input{font:inherit}button,select{min-height:44px;border:1px solid #424242;border-radius:4px;padding:8px 12px;background:#191919;color:#fff}button{background:var(--orange);color:#080808;font-weight:700;border:0;min-width:120px;cursor:pointer}button:disabled{background:#333;color:#aaa;cursor:wait}a{color:#ccc;text-underline-offset:4px}input{width:100%;accent-color:var(--orange);margin:0;min-height:24px;cursor:pointer}.timeline{min-width:0}.info{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#bbb;margin-bottom:5px}.note{grid-column:1/-1;color:#aaa;font-size:11px;margin:0;min-height:14px}select{max-width:190px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:4px}@media(max-width:650px){footer{grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding-top:9px}button{min-width:110px;font-size:12px}select{width:100%;max-width:none;min-height:36px;font-size:12px}footer>a{text-align:center;font-size:11px}.note{font-size:10px}.info{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><iframe id="site" src="index.html" title="CHECK92 — интерактивный сайт" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe><footer aria-label="Просмотр всего сайта"><button id="play" type="button" disabled>Загрузка…</button><div class="timeline"><div class="info"><span id="chapter">CHECK92 / FULL FILM</span><span id="position">0%</span></div><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Позиция в фильме" disabled></div><select id="chapters" aria-label="Перейти к сцене" disabled></select><a href="index.html" target="_top">Сайт без панели ↗</a><p id="status" class="note" role="status">Загружаем сайт. Ничего скачивать не нужно.</p></footer></main>
<script>
'use strict';
(()=>{
const frame=document.querySelector('#site'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),select=document.querySelector('#chapters'),label=document.querySelector('#chapter'),position=document.querySelector('#position'),status=document.querySelector('#status');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const chapters=[['drive','Автомобиль',9],['start','Раскрытие ЭБУ',15],['about','Двигатель V8',8],['services','Разборка двигателя',12],['platform','Выбор автомобиля',6],['process','Обратная сборка',10],['contact','Финал и заявка',7]];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const announce=text=>{if(status.textContent!==text)status.textContent=text};
let win,doc,stops=[],running=false,t=0,total=0,last=0,raf=0,ready=false,waitingSince=0,failedAssets=new Set();
function sync(){
 if(!ready)return;
 const part=stops.find(s=>t<s.end)||stops[stops.length-1];
 label.textContent=part.name;select.value=part.id;seek.value=String(Math.round(t/total*1000));position.textContent=Math.round(t/total*100)+'%';
 play.textContent=running?'Пауза':t>=total-.01?'Ещё раз':'Смотреть всё';play.setAttribute('aria-pressed',String(running));
}
function layout(){
 if(!doc)return;let elapsed=0;
 const found=chapters.map(([id,name,duration])=>({id,name,duration,el:doc.getElementById(id)})).filter(s=>s.el);
 const max=Math.max(0,doc.documentElement.scrollHeight-win.innerHeight);
 stops=found.map((s,i)=>{const top=clamp(s.el.getBoundingClientRect().top+win.scrollY,0,max),next=found[i+1];const endY=next?clamp(next.el.getBoundingClientRect().top+win.scrollY,top,max):max;const result={...s,y:top,to:endY,start:elapsed,end:elapsed+s.duration};elapsed+=s.duration;return result});
 total=elapsed;t=clamp(t,0,total);if(ready)sync();
}
function stop(message){running=false;cancelAnimationFrame(raf);raf=0;last=0;waitingSince=0;if(message)status.textContent=message;sync()}
function move(){const s=stops.find(s=>t<s.end)||stops[stops.length-1];if(!s)return;win.scrollTo(0,s.y+(s.to-s.y)*clamp((t-s.start)/s.duration));sync()}
function assetFor(s){return s.id==='drive'?'car':['about','services','process'].includes(s.id)?'engine':null}
function tick(now){
 if(!running||!ready)return;
 if(document.hidden||doc.hidden){last=now;raf=requestAnimationFrame(tick);return}
 const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 const s=stops.find(s=>t<s.end)||stops[stops.length-1],asset=assetFor(s),canvas=doc.querySelector('#film');
 if(asset&&canvas&&canvas.dataset[asset]!=='ready'&&!failedAssets.has(asset)){
  waitingSince=waitingSince||now;
  if(canvas.dataset[asset]==='failed'||doc.documentElement.classList.contains('film-fallback')||(asset==='engine'&&doc.documentElement.classList.contains('engine-failed'))||now-waitingSince>18000){failedAssets.add(asset);stop('3D-модель не загрузилась. Можно листать сайт вручную или повторить просмотр.');return}
  announce(asset==='car'?'Загружается 3D-автомобиль…':'Загружается 3D-двигатель…');raf=requestAnimationFrame(tick);return;
 }
 waitingSince=0;t=Math.min(total,t+dt);move();
 announce('Прокрутка, касание или клавиша останавливают фильм. Дальше — листай сам.');
 if(t>=total){stop('Фильм завершён. Заявка и выбор автомобиля работают прямо здесь.');return}
 raf=requestAnimationFrame(tick);
}
function fromScroll(){if(running||!ready)return;const y=win.scrollY,s=stops.find(s=>y<s.to-1)||stops[stops.length-1];t=s.start+(s.end-s.start)*clamp((y-s.y)/Math.max(1,s.to-s.y));sync()}
function start(){
 if(!ready)return;
 if(running){stop('Пауза. Можно листать сайт вручную.');return}
 if(reduce.matches){status.textContent='Включено снижение движения: выбери главу для перехода без автопрокрутки.';return}
 layout();if(t>=total-.1){t=0;move()}failedAssets.clear();running=true;last=0;waitingSince=0;sync();raf=requestAnimationFrame(tick);
}
play.addEventListener('click',start);
seek.addEventListener('input',()=>{const value=Number(seek.value);stop('Перемотка. Нажми «Смотреть всё» для продолжения.');t=value/1000*total;move()});
select.addEventListener('change',()=>{const id=select.value;stop('Выбрана сцена. Можно листать вручную или запустить фильм.');layout();const s=stops.find(s=>s.id===id);if(s){t=s.start;move()}});
function loaded(){
 try{
  win=frame.contentWindow;doc=win.document;
  if(!doc.getElementById('start')||!doc.getElementById('contact'))throw Error('missing sections');
  doc.documentElement.style.setProperty('scroll-behavior','auto','important');
  layout();if(!total)throw Error('empty timeline');
  select.replaceChildren(...stops.map(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;return o}));
  ready=true;play.disabled=seek.disabled=select.disabled=false;
  const interrupt=()=>{if(running)stop('Ты управляешь прокруткой. Для продолжения нажми «Смотреть всё».')};
  win.addEventListener('wheel',interrupt,{passive:true});win.addEventListener('touchstart',interrupt,{passive:true});win.addEventListener('pointerdown',interrupt,{passive:true});
  win.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' ','Tab','Escape'].includes(e.key))interrupt()});
  win.addEventListener('scroll',fromScroll,{passive:true});win.addEventListener('resize',layout,{passive:true});
  new ResizeObserver(layout).observe(doc.body);
  status.textContent=reduce.matches?'Снижение движения включено. Переключай сцены через меню.':'Настоящий сайт, не видеозапись. «Смотреть всё» проведёт через все сцены.';
  fromScroll();
 }catch(error){ready=false;stop();status.textContent='Не удалось открыть просмотр. Нажми «Сайт без панели».';play.textContent='Недоступно';play.disabled=true}
}
frame.addEventListener('load',loaded);
reduce.addEventListener('change',()=>{if(reduce.matches)stop('Автопрокрутка выключена: включено снижение движения.');else if(ready)status.textContent='Автопрокрутка доступна.'});
addEventListener('pagehide',()=>stop());
setTimeout(()=>{if(!ready)status.textContent='Сайт ещё загружается. Можно открыть его напрямую — «Сайт без панели».'},20000);
})();
</script></body></html>
